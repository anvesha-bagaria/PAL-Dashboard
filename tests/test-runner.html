<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>PAL tests</title><style>body{font:16px system-ui;margin:2rem auto;max-width:900px;padding:0 1rem}li{padding:.35rem}#summary{font-weight:700}.pass{color:#077d4d}.fail{color:#b42318}</style></head><body><main><h1>PAL dashboard tests</h1><p id="summary">Running…</p><ol id="results"></ol></main><script src="../assets/pal-logic.js"></script><script>
window.PALTest={pending:[],pass:0,fail:0,test(name,fn){const t=window.PALTest;t.pending.push(Promise.resolve().then(fn).then(()=>{t.pass++;const li=document.createElement('li');li.className='pass';li.textContent='✓ '+name;document.querySelector('#results').append(li)},e=>{t.fail++;const li=document.createElement('li');li.className='fail';li.textContent='✗ '+name+': '+e.message;document.querySelector('#results').append(li)}))},equal(a,b){if(a!==b)throw Error('expected '+b+', got '+a)},ok(v){if(!v)throw Error('expected truthy value')}};
</script><script src="../data/pal-data.js"></script><script src="pal-logic.test.js"></script><script src="data-integrity.test.js"></script><script>Promise.all(PALTest.pending).then(()=>{const s=document.querySelector('#summary');s.textContent=PALTest.pass+' passed, '+PALTest.fail+' failed';s.className=PALTest.fail?'fail':'pass'});</script></body></html>
